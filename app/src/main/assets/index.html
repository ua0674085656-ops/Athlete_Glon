<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Athlete Glon</title>
<style>
:root{--bg:#191B20;--surface:#22252C;--surface-2:#2C3038;--line:#3A3F49;--ink:#F1EFEA;
 --ink-dim:#9AA0AB;--brass:#E0A33C;--cool:#B5CE7E;--warn:#D97652;--ok:#7FB069;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h3{margin:0;font-weight:650;letter-spacing:-.01em}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:19px}
#athSel{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
 padding:7px 12px;font-size:14px;color:var(--ink)}
main{padding:0 16px}
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--ink-dim);font-weight:600;margin-bottom:10px}
.rec-row,.vol-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:14px}
.rec-name,.vol-name{width:100px;color:var(--ink-dim);flex-shrink:0}
.rec-bar{flex:1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.rec-fill{height:100%;border-radius:4px}
.rec-val{width:44px;text-align:right;font-weight:600}
.vol-track{flex:1;height:20px;background:var(--surface-2);border-radius:5px;position:relative;overflow:hidden}
.vol-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.vol-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-dim);opacity:.55}
.vol-val{width:96px;text-align:right;color:var(--ink-dim);font-size:12.5px}
.plan-title{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.plan-meta{color:var(--ink-dim);font-size:14px;margin:4px 0 12px}
.dur{display:inline-flex;align-items:baseline;gap:5px;background:var(--surface-2);
 border-radius:9px;padding:5px 11px;margin-bottom:12px}
.dur b{font-size:20px;font-weight:700}
.btn-primary{display:block;width:100%;background:var(--brass);color:#1A1508;font-weight:700;
 font-size:17px;padding:17px;border-radius:12px;text-align:center}
.btn-primary:active{transform:scale(.985)}
.btn-ghost{display:block;width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;
 text-align:center;color:var(--ink-dim);font-size:15px;margin-top:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink-dim)}
.chip.on{background:var(--brass);border-color:var(--brass);color:#1A1508;font-weight:600}
.chip .rank{font-weight:700;margin-right:5px;opacity:.75}
.timebox{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.timebox input{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
 padding:9px 10px;color:var(--ink);font:inherit;width:112px}
.trim{border-left:2px solid var(--cool);padding-left:10px;margin:8px 0;font-size:13.5px;color:var(--ink-dim)}
.plan-item{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.plan-item:first-child{border-top:none}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-name{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.ex-pos{color:var(--ink-dim);font-size:13px;white-space:nowrap;padding-top:5px}
.ex-target{color:var(--ink-dim);font-size:13px;margin-bottom:12px}
.prev{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.prev-label{color:var(--ink-dim);font-size:12px;margin-bottom:3px}
.reason{color:var(--brass);font-size:13px;line-height:1.4;padding-left:10px;border-left:2px solid var(--brass)}
.entry{display:flex;gap:10px;margin:16px 0 4px}
.field{flex:1;background:var(--surface-2);border-radius:12px;padding:9px 8px;text-align:center}
.field-lab{font-size:11px;color:var(--ink-dim);margin-bottom:3px}
.field-row{display:flex;align-items:center;justify-content:center;gap:4px}
.field-val{font-size:30px;font-weight:700;min-width:66px;letter-spacing:-.03em}
.step{width:38px;height:38px;border-radius:10px;background:var(--surface);font-size:21px;
 font-weight:600;color:var(--ink-dim);flex-shrink:0}
.step:active{background:var(--line)}
.rir-lab{font-size:12px;color:var(--ink-dim);margin:12px 0 6px}
.rir{display:flex;gap:6px}
.rir button{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 0;font-size:15px;color:var(--ink-dim)}
.rir button.on{background:var(--cool);border-color:var(--cool);color:#1B2110;font-weight:700}
.warmup-block{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px;border-left:2px solid var(--cool)}
.warmup-block b{color:var(--cool)}
.medal{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-left:4px}
.medal.b{background:linear-gradient(180deg,#B87333,#8B5A2B)}
.medal.s{background:linear-gradient(180deg,#E8E8E8,#A8A8A8)}
.medal.g{background:linear-gradient(180deg,#FFD700,#C9A227);box-shadow:0 0 4px rgba(255,215,0,.5)}
.sets{margin-top:14px}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.set-n{width:22px;color:var(--ink-dim);font-size:13px}
.set-main{flex:1;font-weight:600}
.set-rir{color:var(--ink-dim);font-size:13px}
.pr{background:var(--brass);color:#1A1508;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.set-planned{opacity:.4}
.nav-ex{display:flex;gap:9px;margin-top:14px}
.nav-ex button{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px;
 text-align:center;font-size:15px;color:var(--ink-dim)}
#rest{position:fixed;inset:0;z-index:60;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:rgba(14,15,18,.96);
 display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#rest.on{display:flex}
.ring{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;display:flex;
 align-items:center;justify-content:center;transition:background .3s linear}
.ring-in{width:calc(100% - 34px);aspect-ratio:1;border-radius:50%;background:var(--bg);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-t{font-size:clamp(44px,13vw,68px);font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-lab{font-size:12px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase}
.batt{display:flex;align-items:center;gap:9px;color:var(--ink-dim);font-size:14px}
.rest-ctl{display:flex;gap:16px;align-items:center}
.rest-ctl button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);
 font-size:16px;font-weight:600;color:var(--ink);background:var(--surface)}
.rest-ctl button.big{width:82px;height:82px;font-size:26px}
#restSkip{border:1px solid var(--line);border-radius:999px;padding:12px 34px;
 font-size:15px;color:var(--ink-dim);letter-spacing:.04em}
.ex-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ex-item:first-child{border-top:none}
.fit{font-size:14px;font-weight:700;color:var(--brass);margin-left:auto;padding-left:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-dim);margin-top:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.set-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
 padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.set-item:first-child{border-top:none}
select,input[type=number],input[type=text],input[type=time],input[type=date]{background:var(--surface-2);
 color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;max-width:150px}
input[type=number]{width:92px;text-align:right}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.mgrid label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;color:var(--ink-dim)}
.mgrid input{width:74px;padding:6px 8px}
.delta{font-size:13px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--warn)}
.day-open{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:2px 0 10px}
.week-move{display:flex;gap:5px;margin-left:6px}
.week-move button{width:30px;height:30px;border-radius:8px;background:var(--surface-2);
 color:var(--ink-dim);font-size:13px}
.week-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
 border-top:1px solid var(--line);font-size:14.5px}
.week-row:first-child{border-top:none}
.week-day{width:34px;color:var(--ink-dim);font-size:13px;flex-shrink:0}
.week-name{flex:1;font-weight:600;font-size:14px}
.week-dur{color:var(--ink-dim);font-size:13px;white-space:nowrap}
.week-row.today .week-name{color:var(--brass)}
.bignum{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bignum input{width:74px;font-size:26px;font-weight:700;text-align:center;padding:6px}
.macros{display:flex;gap:8px;margin-top:10px}
.macro{flex:1;background:var(--surface-2);border-radius:11px;padding:10px 8px;text-align:center}
.macro b{display:block;font-size:19px;font-weight:700}
.macro span{font-size:11px;color:var(--ink-dim)}
.kcal{font-size:34px;font-weight:700;letter-spacing:-.02em}
.conflict{background:rgba(224,163,60,.13);border-radius:10px;padding:10px 12px;
 font-size:13px;color:var(--brass);margin-top:10px;line-height:1.45}
#sheet{position:fixed;inset:0;background:rgba(12,13,16,.72);z-index:40;display:flex;
 flex-direction:column;justify-content:flex-end}
#sheet.hidden{display:none}
.sheet-body{background:var(--surface);border-radius:18px 18px 0 0;max-height:86vh;
 display:flex;flex-direction:column;padding:14px 14px 0}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h3{flex:1;font-size:16px;color:var(--ink)}
.sheet-head button{font-size:15px;color:var(--ink-dim)}
#pickQ{width:100%;max-width:none;margin-bottom:8px}
#sheetList{overflow-y:auto;padding-bottom:20px}
.pick{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.pick .n{font-size:15px;font-weight:600}
.pick .m{font-size:12.5px;color:var(--ink-dim)}
.item-act{display:flex;gap:6px;margin-left:auto}
.item-act button{border:1px solid var(--line);border-radius:8px;padding:5px 9px;
 font-size:12.5px;color:var(--ink-dim)}
.item-act button.mv{padding:5px 7px;font-size:14px}
.figwrap{position:sticky;top:0;z-index:8;background:var(--surface);
 display:flex;gap:16px;justify-content:center;align-items:flex-end;padding-bottom:4px}
.figcol{display:flex;flex-direction:column;align-items:center}
.fig-cap{text-align:center;font-size:11px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.grp-head,.cat-head{display:flex;width:100%;text-align:left;background:none;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);
 font-size:15px;font-weight:600}
.grp-head:first-child,.cat-head:first-child{border-top:none}
.grp-head .arw,.cat-head .arw{color:var(--ink-dim);font-size:13px;transition:transform .2s}
.grp-head.open .arw,.cat-head.open .arw{transform:rotate(90deg)}
.grp-sum{margin-left:auto;font-size:13px;color:var(--brass);font-variant-numeric:tabular-nums}
.cat-cnt{margin-left:auto;font-size:13px;color:var(--ink-dim)}
.ord-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.ord-row:first-child{border-top:none}
.ord-n{width:22px;color:var(--brass);font-weight:700}
.ord-name{flex:1}
.ord-v{color:var(--ink-dim);font-size:13px;font-variant-numeric:tabular-nums}
.ord-row button{width:34px;height:34px;border-radius:9px;background:var(--surface-2);
 color:var(--ink-dim);font-size:15px}
.zone-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.zone-n{flex:1;font-size:14.5px}
.zone-v{width:56px;text-align:center;font-weight:700;font-size:15px}
.zone-row button{width:36px;height:36px;border-radius:9px;background:var(--surface-2);
 font-size:19px;font-weight:600;color:var(--ink-dim);flex-shrink:0}
.zone-slider{width:100%;margin:2px 0 4px;-webkit-appearance:none;appearance:none;
 height:26px;background:transparent}
.zone-slider::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--surface-2)}
.zone-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
 background:var(--brass);margin-top:-9.5px;border:none}
.zone-slider::-moz-range-track{height:5px;border-radius:3px;background:var(--surface-2)}
.zone-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--brass);border:none}
.zone-block{padding:9px 0;border-top:1px solid var(--line)}
.zone-block:first-child{border-top:none}
.sc{display:flex;gap:8px;margin-top:10px}
.sc div{flex:1;background:var(--surface-2);border-radius:11px;padding:10px 8px;text-align:center}
.sc b{display:block;font-size:19px;font-weight:700}
.sc span{font-size:11px;color:var(--ink-dim)}
.vd-real{color:var(--ok)}.vd-hard{color:var(--brass)}.vd-beyond{color:var(--warn)}
.warn-item{border-left:2px solid var(--warn);padding-left:10px;margin:8px 0;
 font-size:13px;color:var(--warn);line-height:1.4}
.warn-item.soft{border-color:var(--cool);color:var(--cool)}
.add-ex{border:1px dashed var(--line);border-radius:11px;padding:11px;width:100%;
 text-align:center;color:var(--ink-dim);font-size:14px;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
 display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 13px;font-size:11px;color:var(--ink-dim);
 display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brass)}
nav .ic{font-size:18px;line-height:1}
.hidden{display:none}
.muted{color:var(--ink-dim);font-size:14px}
.warnbox{background:rgba(217,118,82,.13);border-radius:10px;padding:10px 12px;
 font-size:13px;color:var(--warn);margin-bottom:10px}
.evidence{font-size:12.5px;color:var(--ink-dim);line-height:1.45;margin-top:10px;
 padding-top:10px;border-top:1px solid var(--line)}
.ex-tools{display:flex;gap:6px;margin-top:6px}
.ex-tools button{border:1px solid var(--line);border-radius:8px;padding:5px 10px;
 font-size:12px;color:var(--ink-dim)}
.ex-tools button.on{border-color:var(--brass);color:var(--brass)}
.ex-tools button.ban.on{border-color:var(--warn);color:var(--warn)}
#baseQ{width:100%;max-width:none;margin-bottom:10px}
</style>

<header><h1>Athlete Glon <span style="font-size:12px;color:#B5CE7E;font-weight:600">v37</span></h1><select id="athSel"></select></header>
<main>
  <section id="v-today"></section>

</main>
<div id="sheet" class="hidden"></div>
<div id="rest"></div>

 const g=p.goals||[];
 if(g.includes("waist"))return"deficit";

function goalConflicts(p){

 if(g.includes("waist")&&g.some(x=>GOALS[x]&&GOALS[x].grow))out.push(t("conflictGrow"));

function migrate(db){
 if(!db||typeof db!=="object")return {db,log:["not an object"]};
 if(!db.schema||typeof db.schema!=="number")db.schema=1;
 const log=[];
 if(db.schema>SCHEMA_CURRENT)
  log.push("warning: db.schema="+db.schema+" > "+SCHEMA_CURRENT);
 return {db,log};}
let DB=(()=>{
 try{
  const loaded=Store.load();
  const source=loaded||JSON.parse(JSON.stringify(DEFAULT_DB));
  const {db,log}=migrate(source);
  if(log.length)console.log("[Athlete Glon] migrate:",log.join(", "));
  return db;
 }catch(e){
  console.error("[Athlete Glon] load failed:",e);
  return JSON.parse(JSON.stringify(DEFAULT_DB));
 }
})();

function initialWeight(ex){
 const share=BW_SHARE[ex.id];
 if(!share)return null;
 const m=lastMeas();
 const bw=m&&m.weight?m.weight:(A().profile.sex==="f"?62:80);
 const step=weightStep(ex);
 return Math.max(step,Math.round(bw*share/step)*step);}
function lastSets(id){const S=A().sessions;
 for(let i=S.length-1;i>=0;i--){const s=S[i].sets.filter(x=>x.exerciseId===id);if(s.length)return s;}return null;}
function recommend(id,i,range){
 const ex=EX[id],prev=lastSets(id),[lo,hi]=range||ex.repRange,step=weightStep(ex);
 if(!prev)return{weight:null,reps:lo,reason:"first"};
 const p=prev[Math.min(i,prev.length-1)];
 if(prev.every(s=>s.reps>=hi))return{weight:p.weight+step,reps:lo,reason:"topRange"};
 if((p.rir??2)>=2)return{weight:p.weight,reps:p.reps+1,reason:"addRep"};
 if((p.rir??2)<=1&&p.reps>=lo)return{weight:p.weight,reps:p.reps,reason:"hold"};
 return{weight:p.weight,reps:p.reps,reason:"drop"};}

function decayHalflife(m){return MUSCLES[m].size==="large"?72:48;}
function decayFactor(h,m){return Math.pow(.5,h/decayHalflife(m));}

function recovery(){
 const now=Date.now(),acc={},a=A();Object.keys(MUSCLES).forEach(m=>acc[m]=0);
 const k={beginner:1.2,intermediate:1,advanced:.85}[a.profile.experience]||1;
 const ageK=ageOf(a)>=50?1.2:ageOf(a)>=40?1.1:1;
 a.sessions.slice(-14).forEach(s=>{const h=(now-new Date(s.finishedAt).getTime())/36e5;
  s.sets.forEach(x=>{const ex=EX[x.exerciseId];if(!ex)return;
   const iF={0:1.3,1:1.15,2:1,3:.85}[x.rir]??.7;
   Object.entries(ex.muscles).forEach(([m,w])=>{if(!MUSCLES[m])return;
    acc[m]+=w*iF*(ex.ratings.fatigue/10)*k*Math.pow(.5,h/((MUSCLES[m].size==="large"?36:24)*ageK));});});});
 const r={};Object.keys(MUSCLES).forEach(m=>r[m]=Math.max(0,Math.min(100,Math.round(100-acc[m]*11))));
 return r;}

function accumulatedLoad(){
 const now=Date.now(),acc={};Object.keys(MUSCLES).forEach(m=>acc[m]=0);
 A().sessions.forEach(s=>{
  const t=new Date(s.finishedAt).getTime();
  if(now-t>7*864e5)return;
  const h=(now-t)/36e5;
  s.sets.forEach(x=>{const ex=EX[x.exerciseId];if(!ex)return;
   const iF={0:1.3,1:1.15,2:1,3:.85}[x.rir]??1;
   Object.entries(ex.muscles).forEach(([m,w])=>{if(!MUSCLES[m])return;
    acc[m]+=w*iF*decayFactor(h,m);});});});
 return acc;}

function weeklyVolume(){
 const from=Date.now()-7*864e5,o={};Object.keys(MUSCLES).forEach(m=>o[m]=0);

  s.sets.forEach(x=>{const ex=EX[x.exerciseId];if(!ex)return;
   Object.entries(ex.muscles).forEach(([m,w])=>{if(MUSCLES[m])o[m]+=w;});});});return o;}

function volTarget(m){
 const M=MUSCLES[m],raw=M.mav*PRIORITY_K[PRIO()[m]||"normal"];
 const k=mesoEntry(mesoWeek()).k;
 const v=Math.min(M.mrv*1.05,Math.max(M.mev*.7,raw*k));
 const a=A();
 const isM=isMinor(a);
 const isOlder=!isM&&ageOf(a)>=50;
 const f=isM?0.7:isOlder?0.85:1;
 return Math.round(v*f);}

function directMin(m){
 const pr=PRIO()[m]||"normal";
 if(pr==="min")return 0;
 const share=MUSCLES[m].size==="large"?.4:.5;
 return Math.round(volTarget(m)*share);}

function fitScore(ex){
 const p=A().profile,g=gym(),pr=PRIO();
 if(!ex.equipment.every(e=>g.equipment.includes(e)))return null;
 if(p.blacklist.includes(ex.id))return null;
 for(const[j,l]of Object.entries(ex.joint))if(p.restrictions[j]==="high"&&l==="high")return null;
 let target=0;Object.entries(ex.muscles).forEach(([m,w])=>{if(MUSCLES[m])
  target=Math.max(target,w*PRIORITY_K[pr[m]||"normal"]);});
 let safe=ex.ratings.safe;
 Object.entries(ex.joint).forEach(([j,l])=>{if(p.restrictions[j]&&l==="high")safe-=3;
  else if(p.restrictions[j]&&l==="medium")safe-=1.2;});
 const lvl={beginner:10-ex.ratings.tech,intermediate:9,advanced:8+ex.ratings.tech/8}[p.experience]||9;
 return Math.round(40*Math.min(target,1.4)/1.4+20*ex.ratings.eff/10+15*Math.max(0,safe)/10
  +10*Math.min(lvl,10)/10+10*(p.favorites.includes(ex.id)?10:6)/10+5*ex.ratings.prog/10);}

function isPR(id,w,r){const e1=x=>x.weight*(1+x.reps/30);let b=0;
 A().sessions.forEach(s=>s.sets.forEach(x=>{if(x.exerciseId===id)b=Math.max(b,e1(x));}));
 const c=A().current;
 if(c&&c.sets)c.sets.forEach(x=>{if(x.exerciseId===id)b=Math.max(b,e1(x));});
 return b>0&&w*(1+r/30)>b;}

function medalFor(set,prevSet){
 if(!prevSet)return null;
 const cur=set.weight*(1+set.reps/30);
 const prev=prevSet.weight*(1+prevSet.reps/30);
 if(cur<prev)return null;
 const dW=set.weight-prevSet.weight;
 const dR=set.reps-prevSet.reps;
 if(dW>0||dR>=2)return"g";
 if(dR>=1)return"s";
 return"b";}
function medalHTML(m){
 if(!m)return"";
 const cls=m==="g"?"g":m==="s"?"s":"b";
 const title=m==="g"?t("medalG"):m==="s"?t("medalS"):t("medalB");
 return `<span class="medal ${cls}" title="${title}"></span>`;}

/* Разминка: 20/40/60% × 12, пороги 30 и 60 минут */
function sessionMuscleStatus(muscleId){
 const c=A().current;
 if(!c||!c.sets.length)return"fresh";
 const now=Date.now();
 let lastAssist=null,lastMain=null;
 c.sets.forEach(x=>{const ex=EX[x.exerciseId];if(!ex)return;
  const w=ex.muscles[muscleId];if(!w)return;
  const minsAgo=(now-new Date(x.at).getTime())/60000;
  if(w>=1){if(lastMain===null||minsAgo<lastMain)lastMain=minsAgo;}
  else{if(lastAssist===null||minsAgo<lastAssist)lastAssist=minsAgo;}});
 if(lastMain!==null)return"already";
 if(lastAssist===null)return"fresh";
 if(lastAssist<30)return"light";
 if(lastAssist<60)return"medium";
 return"fresh";}
function warmupSets(exerciseId){
 const ex=EX[exerciseId];
 const prim=Object.keys(ex.muscles).find(m=>ex.muscles[m]===1&&MUSCLES[m]);
 if(!prim)return null;
 const status=sessionMuscleStatus(prim);
 if(status==="already")return null;
 const prev=lastSets(exerciseId);
 const base=prev&&prev.length?prev[prev.length-1].weight:null;
 if(!base)return null;
 const sets=[];
 if(status==="fresh"){
  sets.push({pct:.20,reps:12,kg:round5(base*.20)});
  sets.push({pct:.40,reps:12,kg:round5(base*.40)});
  sets.push({pct:.60,reps:12,kg:round5(base*.60)});}
 else if(status==="medium"){
  sets.push({pct:.40,reps:12,kg:round5(base*.40)});
  sets.push({pct:.60,reps:12,kg:round5(base*.60)});}
 else if(status==="light"){
  sets.push({pct:.60,reps:12,kg:round5(base*.60)});}
 return sets.length?sets:null;}
function round5(x){const g=gym();const step=g.barStep;
 return Math.max(step,Math.round(x/step)*step);}

/* Длительность */
const TEMPO=3.5,SETUP=18,TRANSITION=45,WARMUP=300,WARMSETS=150;
function itemSeconds(it){const ex=EX[it.exerciseId];
 const rr=it.reps||ex.repRange,rest=it.rest||ex.rest;
 const mid=(rr[0]+rr[1])/2;
 let sec=it.targetSets*(mid*TEMPO+SETUP)+(it.targetSets-1)*rest+TRANSITION;
 if(it.method==="myo")sec-=45;
 if(it.method==="drop")sec+=60;
 if(it.method==="restpause")sec+=45;
 return Math.max(60,sec);}
function planSeconds(plan,cardio){if(!plan.length)return 0;
 return WARMUP+(EX[plan[0].exerciseId].type==="compound"?WARMSETS:0)
  +plan.reduce((s,it)=>s+itemSeconds(it),0)+(cardio||0)*60;}

  dmin[m]=Math.min(directMin(m),targetIn[m]);dacc[m]=0;

  calves:"legs",abs:"core"};

  let guard2=0;

   const fam=FAMILY[m];

   if(p.useAdvancedMethods){

function w1(e,prim,deficit,dDef,target,dmin,theme){
 let sc=0;
 Object.entries(e.muscles).forEach(([m,w])=>{
  if(!MUSCLES[m]||!theme.includes(m))return;
  sc+=w*Math.max(0,deficit[m])/Math.max(target[m],1);
  if(w>=1)sc+=1.4*Math.max(0,dDef[m])/Math.max(dmin[m],1);});
 return sc;}
function dayName(items){

  .map(([m])=>MUSCLES[m][L()]).join(" · ")||"—";}
function orderPlan(items,muscles){
 const theme=Array.isArray(muscles)?muscles:(THEMES[muscles]?THEMES[muscles].m:[]);
 const byMuscle={};
 items.forEach(it=>{const m=primaryOf(it.exerciseId)||"_";(byMuscle[m]=byMuscle[m]||[]).push(it);});
 const mrank=m=>{
  if(m==="abs")return 900;
  const hasC=byMuscle[m].some(it=>EX[it.exerciseId].type==="compound")?0:100;
  const ti=theme.indexOf(m);
  return hasC+(ti<0?50:ti);};
 return Object.keys(byMuscle).sort((a,b)=>mrank(a)-mrank(b))
  .flatMap(m=>byMuscle[m].sort((a,b)=>{
   const ca=EX[a.exerciseId].type==="compound"?0:1,cb=EX[b.exerciseId].type==="compound"?0:1;
   return ca-cb||EX[b.exerciseId].ratings.fatigue-EX[a.exerciseId].ratings.fatigue;}))
  .map(it=>({...it}));}

function importance(it,idx){
 const ex=EX[it.exerciseId],p=A().profile,f=fitScore(ex)??50,pr=PRIO();
 let target=0;Object.entries(ex.muscles).forEach(([m,w])=>{if(MUSCLES[m])
  target=Math.max(target,w*PRIORITY_K[pr[m]||"normal"]);});
 let s=.45*f/100+.25*(ex.type==="compound"?1:.45)+.3*target/1.4;
 if(p.focus.includes(ex.id))s+=.6;
 if(idx===0)s+=.35;
 const ord=zoneOrder(),zid=Object.keys(ZMAP).find(z=>ZMAP[z].m===primaryOf(ex.id));
 if(zid){const oi=ord.indexOf(zid);
  if(oi>=0)s+=.8*(ord.length-oi)/ord.length;}

function trimPlan(basePlan,minutes){
 let plan=basePlan.map((it,i)=>({...it,imp:importance(it,i)}));
 const avail=minutes*60,changes=[];
 const locked=new Set(plan.filter((it,i)=>i===0||A().profile.focus.includes(it.exerciseId)).map(it=>it.exerciseId));
 let guard=0;
 while(planSeconds(plan)>avail&&guard++<100){
  const cut=plan.filter(it=>it.targetSets>2).sort((a,b)=>a.imp-b.imp);
  if(cut.length){const it=cut[0];it.targetSets--;
   const c=changes.find(c=>c.id===it.exerciseId&&c.type==="sets");
   c?c.n++:changes.push({type:"sets",id:it.exerciseId,n:1});continue;}
  const drop=plan.filter(it=>!locked.has(it.exerciseId)).sort((a,b)=>a.imp-b.imp)[0]
   ||(plan.length>2?plan.slice().sort((a,b)=>a.imp-b.imp)[0]:null);
  if(drop){plan=plan.filter(x=>x!==drop);changes.push({type:"cut",id:drop.exerciseId});continue;}
  const last=plan.filter(it=>it.targetSets>1).sort((a,b)=>a.imp-b.imp)[0];
  if(last){last.targetSets--;continue;}break;}

function nutrition(){
 const a=A(),p=a.profile,m=lastMeas();
 if(!m||!m.weight)return null;
 const kg=m.weight,age=ageOf(a);
 const bmr=10*kg+6.25*p.heightCm-5*age+(p.sex==="f"?-161:5);
 const af=Math.min(1.75,1.35+.03*p.trainingDays.length+.03*cardioSessions(p));
 const tdee=bmr*af;
 let mode=energyMode(p);
 if(isMinor(a)&&mode==="deficit")mode="maintain";
 let kcal=tdee,rate=0;
 if(mode==="deficit"){rate=.004;kcal=tdee-kg*rate*7700/7;}
 if(mode==="surplus"){rate=.0015;kcal=tdee+kg*rate*7700/7;}
 kcal=Math.max(kcal,bmr);
 const protein=Math.round(kg*2),fat=Math.round(kg*.9);
 const carbs=Math.max(60,Math.round((kcal-protein*4-fat*9)/4));
 return{kcal:Math.round(kcal/10)*10,protein,fat,carbs,mode,
  rateKg:Math.round(kg*rate*10)/10,bmr:Math.round(bmr),tdee:Math.round(tdee)};}

 if(weeks<=0||Math.abs(diff)<.5)return null;
 const minor=isMinor(A());
 const maxRate=m.weight*(diff>0?(minor?.003:.006):(minor?.0015:.0025));
 const need=Math.abs(diff)/weeks;
 if(need<=maxRate)return{ok:true,need:Math.round(need*100)/100};

 return{ok:false,date:d.toLocaleDateString(),need:Math.round(need*100)/100};}

function responseReport(){
 const a=A(),now=Date.now(),win=56*864e5,half=now-win/2;
 const sess=a.sessions.filter(s=>new Date(s.finishedAt).getTime()>=now-win);
 if(sess.length<6)return null;
 const e1=x=>x.weight*(1+x.reps/30);
 const out=[];
 Object.keys(MUSCLES).forEach(m=>{
  let direct=0,early=0,late=0;
  sess.forEach(s=>{const t0=new Date(s.finishedAt).getTime();
   s.sets.forEach(x=>{const ex=EX[x.exerciseId];if(!ex)return;
    if(primaryOf(x.exerciseId)!==m)return;
    direct++;
    const v=e1(x);
    if(t0<half)early=Math.max(early,v);else late=Math.max(late,v);});});
  if(direct<8)return;
  const perWeek=Math.round(direct/8*10)/10;
  const strength=(early&&late)?(late-early)/early*100:null;
  let girth=null;const f=GIRTH[m];
  if(f&&a.measurements.length>1){
   const first=a.measurements.find(x=>new Date(x.date).getTime()>=now-win)||a.measurements[0];
   const last=a.measurements[a.measurements.length-1];
   const gv=x=>{const vals=f.map(k=>x[k]).filter(v=>v!=null);
    return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;};
   const g1=gv(first),g2=gv(last);
   if(g1&&g2&&first!==last)girth=Math.round((g2-g1)*10)/10;}
  const tg=volTarget(m);
  let verdict,advice;
  if(strength===null){verdict="respNo";advice=null;}
  else if(strength>=3||(girth!==null&&girth>=.3)){verdict="respYes";
   advice=perWeek<tg*.9?"respAdvAdd":"respAdvHold";}
  else if(perWeek<tg*.6){verdict="respLow";advice="respAdvAdd";}
  else{verdict="respFlat";advice="respAdvStim";}
  out.push({m,perWeek,tg,strength,girth,verdict,advice});});
 return out.length?out:null;}

function leanRate(){
 const a=A(),p=a.profile;
 let r={beginner:.9,intermediate:.45,advanced:.2}[p.experience]||.45;
 const age=ageOf(a);
 if(age>=50)r*=.7;else if(age>=40)r*=.85;
 if(p.sex==="f")r*=.6;
 return r;}
function fatRateKg(){const m=lastMeas();return m&&m.weight?m.weight*.004*4.33:1.5;}
function bodyFatPct(){
 const m=lastMeas(),a=A();
 if(m&&m.bodyFat)return m.bodyFat/100;
 const h=a.profile.heightCm;
 if(!h||!m)return a.profile.sex==="f"?.30:.25;
 let v=null;
 if(a.profile.sex==="f"){
  if(m.waist&&m.hips&&m.neck&&(m.waist+m.hips-m.neck)>0)
   v=163.205*Math.log10(m.waist+m.hips-m.neck)-97.684*Math.log10(h)-78.387;
 }else{
  if(m.waist&&m.neck&&(m.waist-m.neck)>0)
   v=86.010*Math.log10(m.waist-m.neck)-70.041*Math.log10(h)+36.76;
 }
 if(v!=null&&v>4&&v<60)return v/100;
 return a.profile.sex==="f"?.30:.25;}
function translateGoal(){
 const a=A(),p=a.profile,m=lastMeas(),d=p.desire||{};
 if(!m||!m.weight)return null;
 const kg=m.weight,bf=bodyFatPct(),lean=kg*(1-bf);
 const rows=[];let leanNeed=0,fatNeed=0;
 ZONES.forEach(z=>{
  const pct=(d[z.id]||0)/100;if(!pct)return;
  if(z.fat){const cur=m[z.girth]||0;const cm=cur?cur*Math.abs(pct)*.5:0;const kgFat=cm/0.9;
   fatNeed+=Math.max(0,kgFat);rows.push({z,pct:pct*100,cm:-cm,kg:-kgFat,fat:true});return;}
  const girth=z.girth==="armL"?avg(m.armL,m.armR):(z.girth==="thighL"?avg(m.thighL,m.thighR):m[z.girth]);
  const cm=girth?girth*z.frac*(Math.sqrt(1+pct)-1):null;
  const kgLean=lean*z.share*pct;leanNeed+=Math.max(0,kgLean);
  rows.push({z,pct:pct*100,cm,kg:kgLean});});
 if(!rows.length)return null;
 const recomp=leanNeed>0&&fatNeed>0;
 const recompK=recomp?Math.max(.5,Math.min(1,.5+(bf-.15)*1.6)):1;
 const lr=leanRate()*recompK;
 const mLean=leanNeed>0?leanNeed/lr:0,mFat=fatNeed>0?fatNeed/fatRateKg():0;
 const base=Math.max(mLean,mFat);
 rows.forEach(r=>{const need=r.fat?Math.abs(r.kg)/fatRateKg():Math.abs(r.kg)/lr;
  r.months=need;r.verdict=need<=8?"real":need<=18?"hard":"beyond";});
 const diff=Math.min(100,Math.round(base*4+(recomp?10:0)));
 return{rows,leanNeed,fatNeed,bf,recomp,
  months:{opt:base*.8,real:base,cons:base*1.35},difficulty:diff,lr};}
function fitToDeadline(months){
 const r=translateGoal();if(!r||!months)return null;
 const k=Math.max(.1,Math.min(1,months/Math.max(r.months.real,.1)));
 const d=A().profile.desire||{},out={};
 Object.keys(d).forEach(z=>{out[z]=Math.round(d[z]*k);});
 return{k,desire:out,share:Math.round(k*100)};}
function prioritiesFromDesire(p){
 const d=p.desire||{};
 const vals=Object.entries(d).filter(([k,v])=>v>0&&ZMAP[k]&&ZMAP[k].m);
 if(!vals.length)return null;
 const out={};Object.keys(MUSCLES).forEach(m=>out[m]="maintain");
 vals.sort((a,b)=>b[1]-a[1]);const top=vals[0][1];
 vals.forEach(([k,v])=>{const rel=v/top;
  out[ZMAP[k].m]=rel>=.9?"max":rel>=.6?"high":rel>=.3?"normal":"maintain";});
 return out;}

function hexToRgb(hex){
 hex=hex.replace('#','');
 if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
 return[parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)];}
function nearestMuscle(hex){
 if(!hex||hex.length<4)return null;
 const[r,g,b]=hexToRgb(hex);
 let best=null,bestD=Infinity;
 Object.keys(FIG_MAP).forEach(k=>{const[kr,kg,kb]=hexToRgb(k);
  const d=(r-kr)*(r-kr)+(g-kg)*(g-kg)+(b-kb)*(b-kb);
  if(d<bestD){bestD=d;best=FIG_MAP[k];}});
 return bestD<2500?best:null;}

function svgFigure(sex,view,colorFn,w){
 const src=FIG[sex]&&FIG[sex][view];
 if(!src)return'';
 const clone=src.cloneNode(true);
 const styles={};
 const all=clone.querySelectorAll('style');
 for(let i=0;i<all.length;i++){
  const txt=all[i].textContent||'';
  const re=/\.([a-zA-Z0-9_-]+)\s*\{([^}]*)\}/g;let m;
  while((m=re.exec(txt))){
   const fm=m[2].match(/fill\s*:\s*(#[0-9a-fA-F]{3,8})/);
   if(fm)styles[m[1]]=fm[1].toLowerCase();}}
 clone.querySelectorAll('path').forEach(p=>{
  let hex=(p.getAttribute('fill')||'').toLowerCase().trim();
  if(!hex){const cls=(p.getAttribute('class')||'').trim().split(/\s+/)[0];
   if(cls&&styles[cls])hex=styles[cls];}
  if(!hex||hex==='none')return;
  let muscle=FIG_MAP[hex];
  if(!muscle)muscle=nearestMuscle(hex);
  if(!muscle)return;
  const c=colorFn(muscle);
  if(c){p.setAttribute('fill',c.fill);
   p.removeAttribute('class');
   if(c.opacity!=null)p.setAttribute('opacity',c.opacity);}
  else p.setAttribute('fill','#3A3F49');});
 const vb=(clone.getAttribute('viewBox')||'0 0 200 400').split(' ');
 const aspect=vb.length===4?Number(vb[3])/Number(vb[2]):2.5;
 clone.setAttribute('width',w);
 clone.setAttribute('height',Math.round(w*aspect));
 clone.removeAttribute('class');
 return clone.outerHTML;}

function planWarnings(plan){
 const ru=L()==="ru",out=[];
 const P=i=>primaryOf(plan[i].exerciseId),X=i=>EX[plan[i].exerciseId];
 const pr=PRIO();
 for(let i=0;i<plan.length;i++)for(let j=i+1;j<plan.length;j++){
  if(P(i)===P(j)&&X(i).type==="isolation"&&X(j).type==="compound"){
   const isPriority=pr[P(i)]==="max";
   out.push({soft:isPriority,text:isPriority
    ?(ru?`${nm(X(i))} перед ${nm(X(j))} — предварительное утомление.`
        :`${nm(X(i))} перед ${nm(X(j))} — попереднє втомлення.`)
    :(ru?`${nm(X(i))} стоит перед базовым ${nm(X(j))} — базовое потеряет в весе.`
        :`${nm(X(i))} стоїть перед базовою ${nm(X(j))}.`)});}}
 const assist={triceps:["chest","delts_side"],biceps:["lats"],forearms:["lats"]};
 for(let i=0;i<plan.length;i++){
  const a=assist[P(i)];if(!a||X(i).type!=="isolation")continue;
  for(let j=i+1;j<plan.length;j++)
   if(X(j).type==="compound"&&a.includes(P(j))){
    out.push({soft:false,text:ru
     ?`${nm(X(i))} перед ${nm(X(j))}: утомлённый ассистент ограничит основное движение.`
     :`${nm(X(i))} перед ${nm(X(j))}.`});break;}}
 const absAt=plan.findIndex(it=>primaryOf(it.exerciseId)==="abs");
 if(absAt>=0&&absAt<plan.length-1&&plan.slice(absAt+1).some(it=>EX[it.exerciseId].type==="compound"))
  out.push({soft:false,text:ru?"Пресс стоит до базовых движений.":"Прес стоїть до базових рухів."});
 if(plan.length&&EX[plan[0].exerciseId].type==="isolation"){
  const heavy=plan.find(it=>EX[it.exerciseId].type==="compound");
  if(heavy&&pr[primaryOf(plan[0].exerciseId)]!=="max")
   out.push({soft:false,text:ru?`Первым идёт изоляция. Тяжёлое — ${nm(EX[heavy.exerciseId])}, лучше на свежих силах.`
    :`Першою йде ізоляція.`});}
 return out.slice(0,3);}

  pr:isPR(ex.id,entry.weight,entry.reps),at:new Date().toISOString()});

function startRest(sec){
 const c=A().current;if(!c)return;
 c.restTotal=sec;c.restUntil=Date.now()+sec*1000;c.restPaused=null;
 if(window.Native&&Native.restAlarm)try{Native.restAlarm(sec*1000);}catch(e){}
 persist();tickRest();
 clearInterval(rest.timer);rest.timer=setInterval(tickRest,500);}
function restLeft(){
 const c=A().current;if(!c||!c.restUntil)return null;
 if(c.restPaused!=null)return Math.round(c.restPaused/1000);
 return Math.round((c.restUntil-Date.now())/1000);}
function restColor(f){
 const stops=[[0,"#C96A55"],[.25,"#D9905A"],[.55,"#D9C06A"],[1,"#B5CE7E"]];
 for(let i=0;i<stops.length;i++)if(f<=stops[i][0])return stops[i][1];
 return"#B5CE7E";}
function tickRest(){
 const c=A().current,box=el("rest");
 const left=restLeft();
 if(left===null){box.classList.remove("on");box.innerHTML="";return;}
 if(left<=-120){stopRest();return;}
 const total=c.restTotal||120;
 const done=Math.max(0,Math.min(1,(total-Math.max(left,0))/total));
 const frac=Math.max(0,Math.min(1,Math.max(left,0)/total));
 const col=left<=0?"#B5CE7E":restColor(frac);
 const mm=Math.floor(Math.abs(left)/60),ss=Math.abs(left)%60;
 const label=left<=0?t("restOver"):(left<0?"-":"")+mm+":"+String(ss).padStart(2,"0");
 const charge=Math.round(done*100);
 box.classList.add("on");
 box.innerHTML=`
  <div class="ring" style="background:conic-gradient(${col} ${frac*360}deg, var(--surface-2) 0)">
   <div class="ring-in">
    <span class="ring-lab">${t("rest")}</span>
    <span class="ring-t num" style="color:${left<=0?col:"var(--ink)"}">${label}</span>
   </div></div>
  <div class="batt">
   <svg width="46" height="22" viewBox="0 0 46 22">
    <rect x="1" y="1" width="38" height="20" rx="5" fill="none" stroke="#3A3F49" stroke-width="2"/>
    <rect x="41" y="7" width="4" height="8" rx="1.5" fill="#3A3F49"/>
    <rect x="4" y="4" width="${32*done}" height="14" rx="3" fill="${col}"/>
   </svg>
   <span class="num">${charge}%</span>
  </div>
  <div class="rest-ctl">
   <button data-rest="-15">−15</button>
   <button class="big" data-rest="pause">${c.restPaused!=null?"▶":"❚❚"}</button>
   <button data-rest="+15">+15</button>
  </div>
  <button id="restSkip">${t("skip")}</button>`;}
function restAdjust(d){
 const c=A().current;if(!c)return;
 if(c.restPaused!=null)c.restPaused=Math.max(0,c.restPaused+d*1000);
 else c.restUntil=Math.max(Date.now()+1000,c.restUntil+d*1000);
 c.restTotal=Math.max(15,(c.restTotal||120)+d);
 if(window.Native&&Native.restAlarm&&c.restPaused==null)
  try{Native.restAlarm(Math.max(0,c.restUntil-Date.now()));}catch(e){}
 persist();tickRest();}
function restPause(){
 const c=A().current;if(!c||!c.restUntil)return;
 if(c.restPaused!=null){c.restUntil=Date.now()+c.restPaused;c.restPaused=null;
  if(window.Native&&Native.restAlarm)try{Native.restAlarm(c.restUntil-Date.now());}catch(e){}}
 else{c.restPaused=Math.max(0,c.restUntil-Date.now());
  if(window.Native&&Native.cancelAlarm)try{Native.cancelAlarm();}catch(e){}}
 persist();tickRest();}
function stopRest(){clearInterval(rest.timer);rest.timer=null;
 if(window.Native&&Native.cancelAlarm)try{Native.cancelAlarm();}catch(e){}
 const c=A().current;if(c){c.restUntil=null;c.restPaused=null;}
 el("rest").classList.remove("on");el("rest").innerHTML="";persist();}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){
 const c=A().current;
 if(c&&c.restUntil){tickRest();if(!rest.timer)rest.timer=setInterval(tickRest,500);}}});

function zoneProgress(){
 const a=A(),p=a.profile,base=p.goalBaseline,m=lastMeas();
 if(!base||!m)return null;
 const girth=(src,z)=>z.girth==="armL"?avg(src.armL,src.armR)
   :z.girth==="thighL"?avg(src.thighL,src.thighR):src[z.girth];
 const tr=translateGoal();if(!tr)return null;
 const days=(Date.now()-new Date(base.date).getTime())/864e5;
 const rows=[];
 tr.rows.forEach(r=>{
  const z=r.z;if(!z.girth||r.cm==null)return;
  const b=girth(base.meas,z),c=girth(m,z);
  if(!b||!c)return;
  const need=r.cm,done=c-b;
  const pct=need?Math.max(-100,Math.min(200,Math.round(done/need*100))):0;
  const expect=r.months?Math.min(100,Math.round(days/30/r.months*100)):0;
  let st=pct>=100?"progDone":pct>=expect*.8?"progOn":pct>2?"progSlow":"progNo";
  rows.push({z,need,done,pct,expect,st});});
 return{rows,days:Math.round(days)};}

  <div class="set-item"><span>${t("lang")}</span><select id="selLang">

 <div class="card"><button class="btn-ghost" id="expBtn">${t("exportD")}</button>

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="athCancel"){newAth=false;render();return;}
 if(b.id==="athCreate"){
  const nm2=(el("na_name").value||"").trim();
  if(!nm2)return;
  const bd=el("na_bd").value||"2000-01-01";
  const h=parseInt(el("na_h").value,10)||175;
  const sx=el("na_sex").value,lvl=el("na_lvl").value;
  const nid="a"+Date.now().toString(36).slice(-4);
  const na=newAthlete(nid,nm2,sx,bd,h,lvl);
  na.profile.locale=L();na.profile.goals=[];
  DB.athletes.push(na);DB.activeAthlete=nid;
  newAth=false;trim=null;override=null;persist();render();return;}
 if(b.dataset.pick){applyPick(b.dataset.pick);return;}
 if(b.id==="sheetClose"){picker=null;pickQ="";render();return;}
 if(b.id==="warmupSkip"){const c=A().current;
  if(c){c.warmupDone=c.warmupDone||{};c.warmupDone[c.plan[c.exIndex].exerciseId]=true;render();}
  return;}
 if(b.id==="reorderBtn"){const{item}=todaySession();
  override=orderPlan(currentShown(),item?item.muscles:null);render();return;}
 if(b.dataset.act){
  const act=b.dataset.act;
  if(act==="up"||act==="down"){
   const plan=JSON.parse(JSON.stringify(currentShown())),i=+b.dataset.i,j=act==="up"?i-1:i+1;
   if(j>=0&&j<plan.length){[plan[i],plan[j]]=[plan[j],plan[i]];override=plan;}
   render();return;}
  if(act==="del"){const plan=JSON.parse(JSON.stringify(currentShown()));
   if(plan.length>1){plan.splice(+b.dataset.i,1);override=plan;}render();return;}
  if(act==="rep"){const plan=currentShown();
   picker={ctx:"today",mode:"rep",index:+b.dataset.i,near:plan[+b.dataset.i].exerciseId};
   sheetCat=catOf(plan[+b.dataset.i].exerciseId);render();return;}
  if(act==="add"){picker={ctx:"today",mode:"add",near:null};render();return;}
  if(act==="wrep"){const c=A().current;
   picker={ctx:"workout",mode:"rep",near:c.plan[c.exIndex].exerciseId};render();return;}
  if(act==="wadd"){picker={ctx:"workout",mode:"add",near:null};render();return;}}
 if(b.dataset.setmin){A().profile.sessionMinutes=+b.dataset.setmin;
  fitAdviceReset();trim=null;override=null;render();return;}
 if(b.dataset.setdays){const p=A().profile;p.trainingDays=[...DAY_PATTERN[+b.dataset.setdays]];
  if(b.dataset.mm)p.sessionMinutes=+b.dataset.mm;
  fitAdviceReset();trim=null;override=null;render();return;}
 if(b.dataset.zone){
  const p=A().profile;p.desire=p.desire||{};
  const id=b.dataset.zone,z=ZMAP[id],cur=p.desire[id]||0;
  const lo=z.fat?-40:-20,hi=z.fat?20:50;
  const val=Math.max(lo,Math.min(hi,cur+ +b.dataset.dz));
  liveZone(id,val);
  const sl=document.querySelector(`[data-zslider="${id}"]`);if(sl)sl.value=val;
  persist();return;}
 if(b.dataset.grp){openGrp=openGrp===b.dataset.grp?"":b.dataset.grp;render();return;}
 if(b.dataset.openday!==undefined){
  const d=+b.dataset.openday;openDay=openDay===d?null:d;render();return;}
 if(b.dataset.movday!==undefined){
  const p=A().profile,w=generateWeek(),n=w.days.length;
  const perm=(p.dayPerm&&p.dayPerm.length===n)?[...p.dayPerm]:w.days.map((_,i)=>i);
  const i=+b.dataset.movday,j=i+ +b.dataset.dir;
  if(j>=0&&j<n){[perm[i],perm[j]]=[perm[j],perm[i]];p.dayPerm=perm;}
  render();return;}
 if(b.dataset.dact){
  const p=A().profile,day=+b.dataset.dd,act=b.dataset.dact;
  p.planOverrides=p.planOverrides||{};
  const w=generateWeek(),dd=w.days.find(x=>x.day===day);
  if(!dd)return;
  const plan=p.planOverrides[day]?[...p.planOverrides[day]]:JSON.parse(JSON.stringify(dd.plan));
  const i=+b.dataset.i;
  if(act==="reset"){delete p.planOverrides[day];render();return;}
  if(act==="del"){if(plan.length>1)plan.splice(i,1);p.planOverrides[day]=plan;render();return;}
  if(act==="up"||act==="down"){
   const j=i+(act==="up"?-1:1);
   if(j>=0&&j<plan.length){[plan[i],plan[j]]=[plan[j],plan[i]];p.planOverrides[day]=plan;}
   render();return;}
  if(act==="rep"){picker={ctx:"day",day,index:i,near:plan[i].exerciseId};
   sheetCat=catOf(plan[i].exerciseId);render();return;}
  if(act==="add"){picker={ctx:"day",day,mode:"add",near:null};render();return;}}
 if(b.dataset.ord){
  const p=A().profile,ord=zoneOrder(),i=ord.indexOf(b.dataset.ord);
  const j=i+ +b.dataset.dir;
  if(j>=0&&j<ord.length){[ord[i],ord[j]]=[ord[j],ord[i]];p.zoneOrder=ord;}
  render();return;}
 if(b.id==="ordAuto"){
  const p=A().profile,d=p.desire||{};
  p.zoneOrder=Object.keys(d).filter(z=>d[z]&&ZMAP[z])
   .sort((a,b2)=>Math.abs(d[b2])-Math.abs(d[a]));
  render();return;}
 if(b.id==="calcPath"){
  const p=A().profile,m=lastMeas();
  if(m&&!p.goalBaseline)p.goalBaseline={date:new Date().toISOString(),meas:JSON.parse(JSON.stringify(m))};
  pathOpen=true;render();return;}
 if(b.dataset.fit){const fit=fitToDeadline(+b.dataset.fit);
  if(fit){const p=A().profile;
   if(!p.desireBeforeFit)p.desireBeforeFit={...p.desire};
   const cleaned={};Object.entries(fit.desire).forEach(([z,v])=>{if(v)cleaned[z]=v;});
   if(Object.keys(cleaned).length)p.desire=cleaned;
   p.wantMonths=null;}render();return;}
 if(b.id==="restoreDesire"){const p=A().profile;
  if(p.desireBeforeFit){p.desire=p.desireBeforeFit;delete p.desireBeforeFit;}
  render();return;}
 if(b.id==="resetZones"){
  if(!confirm(L()==="ru"?"Сбросить все пожелания по зонам?":"Скинути всі побажання за зонами?"))return;
  const p=A().profile;p.desire={};p.desireBeforeFit=null;
  p.goalBaseline=null;pathOpen=false;render();return;}
 if(b.id==="applyPrio"){
  const p=A().profile,before=weekSnap();
  const pr=prioritiesFromDesire(p);
  if(pr){p.priority=pr;fitAdviceReset();trim=null;override=null;prioDiff=snapDiff(before,weekSnap());}
  tab="settings";render();return;}
 if(b.id==="recToggle"){recNums=!recNums;render();return;}
 if(b.dataset.cat){openCat=openCat===b.dataset.cat?"":b.dataset.cat;render();return;}
 if(b.dataset.scat){sheetCat=sheetCat===b.dataset.scat?"":b.dataset.scat;
  el("sheetList").innerHTML=sheetRows();return;}
 if(b.dataset.eq!==undefined){baseEquip=b.dataset.eq;render();return;}
 if(b.dataset.fav){const p=A().profile,i=p.favorites.indexOf(b.dataset.fav);
  i>=0?p.favorites.splice(i,1):p.favorites.push(b.dataset.fav);
  trim=null;override=null;render();return;}
 if(b.dataset.ban){const p=A().profile,i=p.blacklist.indexOf(b.dataset.ban);
  i>=0?p.blacklist.splice(i,1):p.blacklist.push(b.dataset.ban);
  trim=null;override=null;render();return;}
 if(b.dataset.check){checkOpen=!checkOpen;render();return;}
 if(b.id==="saveCheck"){
  const a=A();a.checkins=a.checkins||[];
  const rec={date:new Date().toISOString(),
   sleep:parseFloat(el("ck_sleep").value)||7,
   soreness:parseInt(el("ck_sore").value,10)||0,
   pain:parseInt(el("ck_pain").value,10)||0,
   stress:parseInt(el("ck_stress").value,10)||0};
  const d=new Date().toDateString();
  const i=a.checkins.findIndex(c=>new Date(c.date).toDateString()===d);
  if(i>=0)a.checkins[i]=rec;else a.checkins.push(rec);
  checkOpen=false;persist();render();return;}
 if(b.id==="resetOverride"){
  if(!confirm(L()==="ru"?"Вернуть сгенерированный план дня?":"Повернути згенерований план дня?"))return;
  override=null;render();return;}
 if(b.id==="recalcPlanBtn"){const before=weekSnap();override=null;trim=null;
  prioDiff=snapDiff(before,weekSnap())||{added:[],removed:[],vol:[]};tab="today";render();return;}
 if(b.id==="resetPrio"){
  if(!confirm(L()==="ru"?"Вернуть приоритеты из целей? Ручные правки сбросятся.":"Повернути пріоритети з цілей? Ручні правки скинуться."))return;
  const before=weekSnap();A().profile.priority=null;
  fitAdviceReset();trim=null;override=null;prioDiff=snapDiff(before,weekSnap());render();return;}
 if(b.dataset.tab){tab=b.dataset.tab;render();return;}
 if(b.dataset.goal){const p=A().profile,g=b.dataset.goal;
  p.goals=p.goals||[];const i=p.goals.indexOf(g);
  const before=weekSnap();
  if(i>=0)p.goals.splice(i,1);else p.goals.push(g);
  p.priority=null;fitAdviceReset();trim=null;override=null;prioDiff=snapDiff(before,weekSnap());render();return;}
 if(b.dataset.day!==undefined){const p=A().profile,i=+b.dataset.day,k=p.trainingDays.indexOf(i);
  k>=0?p.trainingDays.splice(k,1):p.trainingDays.push(i);
  if(!p.trainingDays.length)p.trainingDays.push(i);
  fitAdviceReset();trim=null;render();return;}
 if(b.id==="recalcBtn"){const{item}=todaySession();if(!item)return;
  let minutes=parseInt(el("inpMin").value,10);const until=el("inpUntil").value;
  if(!minutes&&until){const[h,mm]=until.split(":").map(Number),now=new Date();
   const end=new Date();end.setHours(h,mm,0,0);
   if(end<now)end.setDate(end.getDate()+1);
   minutes=Math.round((end-now)/60000);}
  if(!minutes||minutes<15)return;
  trim=trimPlan(item.plan,minutes);render();return;}
 if(b.id==="resetTrim"){
  if(!confirm(L()==="ru"?"Сбросить сокращённый план?":"Скинути скорочений план?"))return;
  trim=null;override=null;render();return;}
 if(b.id==="startBtn"){A().current?tab="workout":startSession();render();return;}
 if(b.id==="saveSet"){
  if(window.__setLock)return;
  window.__setLock=true;
  setTimeout(()=>{window.__setLock=false;},700);
  saveSet();return;}
 if(b.id==="finishBtn"){finishSession();return;}
 if(b.id==="restSkip"){stopRest();return;}
 if(b.dataset.rest){
  if(b.dataset.rest==="pause")restPause();
  else restAdjust(b.dataset.rest==="+15"?15:-15);
  return;}
 if(b.dataset.rir!==undefined){entry.rir=+b.dataset.rir;render();return;}
 if(b.dataset.nav){const c=A().current;
  c.exIndex=Math.max(0,Math.min(c.plan.length-1,c.exIndex+ +b.dataset.nav));
  entry={weight:null,reps:null,rir:2};render();return;}
 if(b.dataset.d){const c=A().current,ex=EX[c.plan[c.exIndex].exerciseId],st=weightStep(ex);
  if(b.dataset.d==="w+")entry.weight=Math.round((entry.weight+st)*100)/100;
  if(b.dataset.d==="w-")entry.weight=Math.max(0,Math.round((entry.weight-st)*100)/100);
  if(b.dataset.d==="r+")entry.reps++;
  if(b.dataset.d==="r-")entry.reps=Math.max(1,entry.reps-1);
  el("fW").textContent=entry.weight;el("fR").textContent=entry.reps;return;}
 if(b.id==="saveMeas"){const rec={date:new Date().toISOString()};
  MFIELDS.forEach(f=>{const v=parseFloat(el("m_"+f).value);if(!isNaN(v))rec[f]=v;});
  if(Object.keys(rec).length>1){A().measurements.push(rec);persist();render();}return;}
 if(b.id==="expBtn"){
  const json=JSON.stringify(DB,null,1);
  const name="athlete-glon-"+new Date().toISOString().slice(0,10)+".json";
  if(window.Native&&Native.export){try{Native.export(json,name);return;}catch(e){}}
  const bl=new Blob([json],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;a.click();return;}
 if(b.id==="pasteBtn"){pasteOpen=!pasteOpen;render();return;}
 if(b.id==="pasteGo"){const v=el("pasteBox").value.trim();
  if(v)window.onImport(v);pasteOpen=false;return;}
 if(b.id==="impBtn"){
  if(window.Native&&Native.importFile){try{Native.importFile();return;}catch(e){}}
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;
   const r=new FileReader();r.onload=()=>window.onImport(r.result);r.readAsText(f);};
  inp.click();return;}
});

document.addEventListener("input",e=>{
 if(e.target.id==="pickQ"){pickQ=e.target.value;el("sheetList").innerHTML=sheetRows();return;}
 if(e.target.dataset.zslider){liveZone(e.target.dataset.zslider,+e.target.value);return;}
 if(e.target.id==="baseQ"){baseQ=e.target.value;
  const sel=document.activeElement;render();
  const q2=el("baseQ");if(q2&&sel&&sel.id==="baseQ"){q2.focus();
   q2.setSelectionRange(q2.value.length,q2.value.length);}
  return;}});

document.addEventListener("change",e=>{
 if(e.target.dataset.zslider){persist();if(pathOpen)render();}},true);

document.addEventListener("change",e=>{
 const id=e.target.id,p=A().profile;
 if(["inpN","inpLen","selLvl"].includes(id))fitAdviceReset();
 if(id==="inpN"){const n=Math.max(1,Math.min(7,+e.target.value||3));
  p.trainingDays=[...DAY_PATTERN[n]];trim=null;render();return;}
 if(id==="inpLen"){p.sessionMinutes=Math.max(20,+e.target.value||70);trim=null;render();return;}
 if(id==="selFit"){p.autoFit=e.target.value==="1";trim=null;override=null;render();return;}
 if(id==="selAdv"){p.useAdvancedMethods=e.target.value==="1";
  fitAdviceReset();trim=null;override=null;render();return;}
 if(id==="inpTW"){p.targetWeight=parseFloat(e.target.value)||null;render();return;}
 if(id==="inpWant"){p.wantMonths=parseInt(e.target.value,10)||null;render();return;}
 if(id==="inpTD"){p.targetDate=e.target.value||null;render();return;}
 if(id==="athSel"){
  if(e.target.value==="__new"){newAth=true;e.target.value=DB.activeAthlete;render();return;}
  DB.activeAthlete=e.target.value;
  normalizeDB();
  trim=null;override=null;prioDiff=null;openDay=null;pathOpen=false;render();return;}
 if(id==="selLang"){p.locale=e.target.value;render();return;}
 if(id==="selLvl"){p.experience=e.target.value;trim=null;render();return;}
 if(id==="inpH"){p.heightCm=+e.target.value||184;render();return;}
 if(id==="inpName"){if(e.target.value.trim())A().name=e.target.value.trim();render();return;}
 if(id==="inpBD"){p.birthDate=e.target.value||p.birthDate;render();return;}
 if(id==="selSex"){p.sex=e.target.value;render();return;}
 if(id==="inpW"){const v=parseFloat(e.target.value);if(v>0)setWeight(v);render();return;}
 if(id==="inpBar"){gym().barStep=+e.target.value||2.5;persist();return;}
 if(id==="inpDb"){gym().dbStep=+e.target.value||1;persist();return;}
 if(e.target.dataset.prio){
  const before=weekSnap();
  const cur=p.priority||prioritiesFromGoals(p);
  cur[e.target.dataset.prio]=e.target.value;p.priority=cur;
  fitAdviceReset();trim=null;override=null;prioDiff=snapDiff(before,weekSnap());render();return;}});

function flash(msg,bad){
 let b=el("flash");
 if(!b){b=document.createElement("div");b.id="flash";document.body.appendChild(b);}
 b.textContent=msg;
 b.style.cssText="position:fixed;left:16px;right:16px;bottom:90px;z-index:99;padding:14px 16px;"+
  "border-radius:12px;font-weight:600;text-align:center;"+
  (bad?"background:#D97652;color:#20120C":"background:#B5CE7E;color:#1B2110");
 clearTimeout(window.__ft);window.__ft=setTimeout(()=>b.remove(),3000);}
window.__onStorageFail=function(){
 flash(L()==="ru"
  ?"Хранилище переполнено — данные сохраняются только на время сессии."
  :"Сховище переповнено — дані зберігаються лише на час сесії.",true);};

/* Патч 16: onImport с валидацией */
window.onImport=function(text){
 try{
  const o=JSON.parse(text);
  if(!o||!Array.isArray(o.athletes)||!o.athletes.length)throw new Error("нет спортсменов");
  o.athletes.forEach((a,i)=>{
   if(!a.id||!a.name)throw new Error("атлет "+i+": нет id или имени");
   if(!a.profile||typeof a.profile!=="object")
    throw new Error("атлет "+i+": нет профиля");});
  DB=o;normalizeDB();
  trim=null;override=null;prioDiff=null;tab="today";persist();render();
  flash(t("importOk"));
 }catch(e){flash(t("importBad")+(e.message?" ("+e.message+")":""),true);}};

/* Патч 13c: keepScreenOn при возврате в активную сессию */
(async()=>{
 await loadFigures();
 render();
 if(A().current&&A().current.restUntil){tickRest();rest.timer=setInterval(tickRest,500);}
 if(A().current&&window.Native&&Native.keepScreenOn)
  try{Native.keepScreenOn(true);}catch(e){}
})();
