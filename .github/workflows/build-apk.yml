name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  APK_NAME: athlete-glon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Сборка debug APK
        run: gradle assembleDebug --no-daemon

      - name: Переименовать
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/${APK_NAME}-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}.apk"

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30
